[llm]
model = "qwen3.8-flash-next-q2_0"          # Strata (local llama.cpp server), same model OpenCode uses
api_key_env = "STRATA_API_KEY"             # key lives in the gitignored .env, never in the repo
max_tokens = 4096                          # the model's output limit (reasoning tokens included)
base_url = "http://192.168.0.109:8080/v1"

[mcp]
url = "http://localhost:25575/mcp"
health_url = "http://localhost:25575/health"
tool_timeout_ms = 3600000
initial_wait_ms = 5000
poll_ms = 2000
max_polls = 900
action_wait_ms = 300000      # one foreground call waits at most this long (drains included), then [BODY_HELD]
max_sse_event_bytes = 16777216
submission_prefix = ""

[laya]
model = "english"         # english checkpoint reads our English state far better than multilingual
preload = false
device = ""            # "" = auto (mps/cuda/cpu)
min_confidence = 0.0   # secondary signal only
max_len = 0            # 0 = checkpoint default

[loop]
max_iterations = 10
max_escalations = 3
hitl = false
stop_when_complete = true   # end the run once diamond kit + worn armour + shield + lit portal + bed + Nether prep are done
wait_hold_s = 30            # seconds a successful `wait` holds before the next decision
log_path = "runs/decisions.jsonl"
memory_path = "MEMORY.md"

[train]
base_model = "english"       # which Laya checkpoint the fine-tune starts from
out_dir = "runs/checkpoints" # where `mlaya train` writes the checkpoint
data_dir = "data"            # where `mlaya dataset` writes train/eval JSONL
epochs = 4
micro_batch = 8
grad_accum = 1               # small log: one accumulation step
loss = "rlcd"                # rlcd (GRPO-style + soft-CE) or soft-ce
freeze_encoder = true        # RLCD head fine-tuning only
