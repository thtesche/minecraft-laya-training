[project]
name = "mlaya"
version = "0.1.0"
description = "Minecraft agent driven by Laya System-1 decisions over the mine-ai MCP server"
requires-python = ">=3.10,<3.14"
dependencies = [
    "laya",
    "mcp",
    "langgraph",
    "openai",
    "pydantic",
    "httpx",
    "python-dotenv",
]

[project.scripts]
mlaya = "mlaya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlaya"]
